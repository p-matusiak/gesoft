<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="200" height="450" fill="#0f172a"/>
  <rect x="199" y="0" width="1" height="450" fill="#334155"/>

  <!-- Logo area -->
  <rect x="20" y="20" width="160" height="40" rx="8" fill="url(#accent)" opacity="0.2"/>
  <text x="100" y="46" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="16" font-weight="bold">LogiCRM</text>

  <!-- Sidebar menu -->
  <rect x="15" y="90" width="170" height="36" rx="6" fill="url(#accent)"/>
  <text x="30" y="113" fill="white" font-family="Arial" font-size="13">Dashboard</text>

  <text x="30" y="155" fill="#64748b" font-family="Arial" font-size="13">Klienci</text>
  <text x="30" y="190" fill="#64748b" font-family="Arial" font-size="13">Zamowienia</text>
  <text x="30" y="225" fill="#64748b" font-family="Arial" font-size="13">Przesylki</text>
  <text x="30" y="260" fill="#64748b" font-family="Arial" font-size="13">Raporty</text>
  <text x="30" y="295" fill="#64748b" font-family="Arial" font-size="13">Ustawienia</text>

  <!-- Main content area -->
  <!-- Header -->
  <text x="230" y="45" fill="white" font-family="Arial" font-size="22" font-weight="bold">Panel Glowny</text>
  <text x="230" y="68" fill="#64748b" font-family="Arial" font-size="12">Witaj, Admin</text>

  <!-- Stats cards -->
  <rect x="230" y="90" width="170" height="90" rx="12" fill="#1e293b"/>
  <text x="250" y="120" fill="#64748b" font-family="Arial" font-size="11">Zamowienia dzis</text>
  <text x="250" y="155" fill="white" font-family="Arial" font-size="28" font-weight="bold">247</text>
  <text x="250" y="172" fill="#22c55e" font-family="Arial" font-size="11">+12% vs wczoraj</text>

  <rect x="415" y="90" width="170" height="90" rx="12" fill="#1e293b"/>
  <text x="435" y="120" fill="#64748b" font-family="Arial" font-size="11">Aktywni klienci</text>
  <text x="435" y="155" fill="white" font-family="Arial" font-size="28" font-weight="bold">1,893</text>
  <text x="435" y="172" fill="#22c55e" font-family="Arial" font-size="11">+5% vs ostatni mies.</text>

  <rect x="600" y="90" width="170" height="90" rx="12" fill="#1e293b"/>
  <text x="620" y="120" fill="#64748b" font-family="Arial" font-size="11">Przychod</text>
  <text x="620" y="155" fill="white" font-family="Arial" font-size="28" font-weight="bold">89.4k</text>
  <text x="620" y="172" fill="#22c55e" font-family="Arial" font-size="11">+23% vs ostatni mies.</text>

  <!-- Chart area -->
  <rect x="230" y="200" width="355" height="220" rx="12" fill="#1e293b"/>
  <text x="250" y="230" fill="white" font-family="Arial" font-size="14" font-weight="bold">Zamowienia - ostatnie 7 dni</text>

  <!-- Chart bars -->
  <rect x="270" y="320" width="30" height="70" rx="4" fill="url(#accent)" opacity="0.6"/>
  <rect x="320" y="290" width="30" height="100" rx="4" fill="url(#accent)" opacity="0.7"/>
  <rect x="370" y="310" width="30" height="80" rx="4" fill="url(#accent)" opacity="0.6"/>
  <rect x="420" y="260" width="30" height="130" rx="4" fill="url(#accent)" opacity="0.8"/>
  <rect x="470" y="280" width="30" height="110" rx="4" fill="url(#accent)" opacity="0.7"/>
  <rect x="520" y="250" width="30" height="140" rx="4" fill="url(#accent)"/>

  <!-- Labels -->
  <text x="285" y="405" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Pon</text>
  <text x="335" y="405" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Wt</text>
  <text x="385" y="405" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Sr</text>
  <text x="435" y="405" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Czw</text>
  <text x="485" y="405" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Pt</text>
  <text x="535" y="405" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Sob</text>

  <!-- Recent orders -->
  <rect x="600" y="200" width="170" height="220" rx="12" fill="#1e293b"/>
  <text x="620" y="230" fill="white" font-family="Arial" font-size="14" font-weight="bold">Ostatnie</text>

  <rect x="615" y="250" width="140" height="35" rx="6" fill="#0f172a"/>
  <text x="625" y="272" fill="white" font-family="Arial" font-size="11">#4521 - Warszawa</text>

  <rect x="615" y="295" width="140" height="35" rx="6" fill="#0f172a"/>
  <text x="625" y="317" fill="white" font-family="Arial" font-size="11">#4520 - Krakow</text>

  <rect x="615" y="340" width="140" height="35" rx="6" fill="#0f172a"/>
  <text x="625" y="362" fill="white" font-family="Arial" font-size="11">#4519 - Gdansk</text>

  <rect x="615" y="385" width="140" height="25" rx="6" fill="url(#accent)" opacity="0.3"/>
  <text x="685" y="402" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="10">Zobacz wszystkie</text>
</svg>