<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg4)"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="70" fill="#0f172a" opacity="0.8"/>

  <!-- Logo -->
  <rect x="40" y="20" width="35" height="30" rx="4" fill="url(#gold)"/>
  <text x="85" y="42" fill="white" font-family="Arial" font-size="18" font-weight="bold">VERTEX</text>
  <text x="160" y="42" fill="#64748b" font-family="Arial" font-size="18">Consulting</text>

  <!-- Navigation -->
  <text x="380" y="42" fill="#94a3b8" font-family="Arial" font-size="13">O nas</text>
  <text x="440" y="42" fill="#94a3b8" font-family="Arial" font-size="13">Uslugi</text>
  <text x="500" y="42" fill="#94a3b8" font-family="Arial" font-size="13">Case Studies</text>
  <text x="600" y="42" fill="#94a3b8" font-family="Arial" font-size="13">Kariera</text>

  <!-- Contact button -->
  <rect x="680" y="20" width="90" height="30" rx="15" fill="url(#accent4)"/>
  <text x="725" y="40" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">Kontakt</text>

  <!-- Hero Section -->
  <text x="60" y="150" fill="#94a3b8" font-family="Arial" font-size="12" font-weight="bold">STRATEGIA • INNOWACJA • WYNIKI</text>
  <text x="60" y="200" fill="white" font-family="Arial" font-size="36" font-weight="bold">Transformujemy</text>
  <text x="60" y="245" fill="white" font-family="Arial" font-size="36" font-weight="bold">biznes na</text>
  <text x="60" y="290" fill="url(#gold)" font-family="Arial" font-size="36" font-weight="bold">globalną skalę</text>

  <text x="60" y="330" fill="#94a3b8" font-family="Arial" font-size="14">Pomagamy firmom osiągać cele poprzez innowacyjne</text>
  <text x="60" y="350" fill="#94a3b8" font-family="Arial" font-size="14">rozwiązania strategiczne i operacyjne.</text>

  <!-- CTA Buttons -->
  <rect x="60" y="375" width="150" height="45" rx="8" fill="url(#accent4)"/>
  <text x="135" y="403" text-anchor="middle" fill="white" font-family="Arial" font-size="13" font-weight="bold">Bezplatna konsultacja</text>

  <rect x="225" y="375" width="130" height="45" rx="8" fill="transparent" stroke="#64748b"/>
  <text x="290" y="403" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="13">Case Studies →</text>

  <!-- Stats Section -->
  <rect x="450" y="120" width="320" height="300" rx="20" fill="#1e293b" opacity="0.6"/>

  <!-- Stat items -->
  <text x="490" y="175" fill="url(#gold)" font-family="Arial" font-size="42" font-weight="bold">500+</text>
  <text x="490" y="200" fill="#94a3b8" font-family="Arial" font-size="12">Zrealizowanych projektow</text>

  <text x="630" y="175" fill="url(#gold)" font-family="Arial" font-size="42" font-weight="bold">98%</text>
  <text x="630" y="200" fill="#94a3b8" font-family="Arial" font-size="12">Zadowolonych klientow</text>

  <text x="490" y="275" fill="url(#gold)" font-family="Arial" font-size="42" font-weight="bold">25</text>
  <text x="490" y="300" fill="#94a3b8" font-family="Arial" font-size="12">Lat na rynku</text>

  <text x="630" y="275" fill="url(#gold)" font-family="Arial" font-size="42" font-weight="bold">12</text>
  <text x="630" y="300" fill="#94a3b8" font-family="Arial" font-size="12">Oddzialow na swiecie</text>

  <!-- Client logos section -->
  <rect x="490" y="330" width="250" height="70" rx="10" fill="#0f172a" opacity="0.5"/>
  <text x="505" y="355" fill="#64748b" font-family="Arial" font-size="10">ZAUFALI NAM:</text>
  <rect x="505" y="365" width="50" height="20" rx="4" fill="#334155"/>
  <rect x="565" y="365" width="50" height="20" rx="4" fill="#334155"/>
  <rect x="625" y="365" width="50" height="20" rx="4" fill="#334155"/>
  <rect x="685" y="365" width="40" height="20" rx="4" fill="#334155"/>

  <!-- Decorative elements -->
  <circle cx="750" cy="100" r="80" fill="url(#accent4)" opacity="0.1"/>
  <circle cx="780" cy="400" r="120" fill="url(#gold)" opacity="0.05"/>
</svg>