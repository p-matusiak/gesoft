<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Label -->
  <text x="400" y="38" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="13">Aplikacja mobilna Android</text>

  <!-- Phone 1 - Map/route view -->
  <rect x="90" y="55" width="180" height="340" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="100" y="75" width="160" height="300" rx="8" fill="#1e3a5f"/>
  <!-- Map bg -->
  <rect x="100" y="75" width="160" height="185" rx="8" fill="#1a3a5c"/>
  <!-- Map grid lines -->
  <line x1="100" y1="110" x2="260" y2="110" stroke="#1e4a70" stroke-width="1"/>
  <line x1="100" y1="145" x2="260" y2="145" stroke="#1e4a70" stroke-width="1"/>
  <line x1="100" y1="180" x2="260" y2="180" stroke="#1e4a70" stroke-width="1"/>
  <line x1="100" y1="215" x2="260" y2="215" stroke="#1e4a70" stroke-width="1"/>
  <line x1="140" y1="75" x2="140" y2="260" stroke="#1e4a70" stroke-width="1"/>
  <line x1="180" y1="75" x2="180" y2="260" stroke="#1e4a70" stroke-width="1"/>
  <line x1="220" y1="75" x2="220" y2="260" stroke="#1e4a70" stroke-width="1"/>
  <!-- Route line -->
  <polyline points="120,230 140,200 165,180 195,160 225,145" stroke="#f97316" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Start/end dots -->
  <circle cx="120" cy="230" r="7" fill="#22c55e"/>
  <circle cx="225" cy="145" r="7" fill="#f97316"/>
  <!-- Status bar -->
  <rect x="100" y="260" width="160" height="115" rx="0" fill="#0f172a"/>
  <rect x="100" y="260" width="160" height="1" fill="#334155"/>
  <text x="180" y="282" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">Dostawa #1042</text>
  <text x="110" y="300" fill="#64748b" font-family="Arial" font-size="10">Status:</text>
  <text x="155" y="300" fill="#f97316" font-family="Arial" font-size="10" font-weight="bold">W drodze</text>
  <text x="110" y="318" fill="#64748b" font-family="Arial" font-size="10">Do celu:</text>
  <text x="155" y="318" fill="white" font-family="Arial" font-size="10">2.4 km</text>
  <rect x="110" y="330" width="140" height="28" rx="6" fill="url(#accent)"/>
  <text x="180" y="349" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">Potwierz odbiór</text>
  <!-- Notch -->
  <rect x="155" y="58" width="70" height="12" rx="6" fill="#334155"/>

  <!-- Phone 2 - Orders list -->
  <rect x="310" y="55" width="180" height="340" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="320" y="75" width="160" height="300" rx="8" fill="#0f172a"/>
  <text x="400" y="97" text-anchor="middle" fill="white" font-family="Arial" font-size="13" font-weight="bold">Moje zlecenia</text>
  <!-- Order cards -->
  <rect x="325" y="108" width="150" height="58" rx="8" fill="#1e293b"/>
  <circle cx="342" cy="131" r="10" fill="#22c55e" opacity="0.2"/>
  <text x="342" y="135" text-anchor="middle" fill="#22c55e" font-family="Arial" font-size="11">✓</text>
  <text x="360" y="126" fill="white" font-family="Arial" font-size="11">#1040 - Nowe Miasto</text>
  <text x="360" y="142" fill="#64748b" font-family="Arial" font-size="10">Zrealizowane · 10:14</text>
  <text x="455" y="126" fill="#22c55e" font-family="Arial" font-size="10">12,00 zl</text>

  <rect x="325" y="174" width="150" height="58" rx="8" fill="#1e3a5f" stroke="#f97316" stroke-width="1"/>
  <circle cx="342" cy="197" r="10" fill="#f97316" opacity="0.2"/>
  <text x="342" y="201" text-anchor="middle" fill="#f97316" font-family="Arial" font-size="11">►</text>
  <text x="360" y="192" fill="white" font-family="Arial" font-size="11">#1042 - Centrum</text>
  <text x="360" y="208" fill="#f97316" font-family="Arial" font-size="10">W trakcie · ~12 min</text>

  <rect x="325" y="240" width="150" height="58" rx="8" fill="#1e293b"/>
  <circle cx="342" cy="263" r="10" fill="#64748b" opacity="0.2"/>
  <text x="342" y="267" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="11">◷</text>
  <text x="360" y="258" fill="white" font-family="Arial" font-size="11">#1043 - Wola</text>
  <text x="360" y="274" fill="#64748b" font-family="Arial" font-size="10">Oczekuje</text>

  <rect x="325" y="308" width="150" height="58" rx="8" fill="#1e293b"/>
  <text x="342" y="331" fill="#64748b" font-family="Arial" font-size="11">#1044 - Mokotow</text>
  <text x="342" y="347" fill="#64748b" font-family="Arial" font-size="10">Oczekuje</text>
  <rect x="155" y="58" width="70" height="12" rx="6" fill="#334155"/>
  <rect x="375" y="58" width="70" height="12" rx="6" fill="#334155"/>

  <!-- Info panel on the right -->
  <rect x="530" y="55" width="220" height="340" rx="12" fill="#1e293b"/>
  <text x="640" y="88" text-anchor="middle" fill="white" font-family="Arial" font-size="15" font-weight="bold">Aplikacja kurierska</text>
  <text x="640" y="108" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="11">Android (Kotlin)</text>

  <rect x="545" y="120" width="190" height="1" fill="#334155"/>

  <text x="545" y="145" fill="#94a3b8" font-family="Arial" font-size="11">● Śledzenie trasy GPS w czasie rzeczywistym</text>
  <text x="545" y="165" fill="#94a3b8" font-family="Arial" font-size="11">● Lista zleceń z priorytetami</text>
  <text x="545" y="185" fill="#94a3b8" font-family="Arial" font-size="11">● Potwierdzenie odbioru / podpis</text>
  <text x="545" y="205" fill="#94a3b8" font-family="Arial" font-size="11">● Powiadomienia push (FCM)</text>
  <text x="545" y="225" fill="#94a3b8" font-family="Arial" font-size="11">● Tryb offline z synchronizacją</text>

  <rect x="545" y="240" width="190" height="1" fill="#334155"/>

  <text x="640" y="263" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Stack technologiczny</text>
  <rect x="545" y="272" width="85" height="24" rx="6" fill="#0f172a"/>
  <text x="587" y="288" text-anchor="middle" fill="#f97316" font-family="Arial" font-size="10">Android Kotlin</text>
  <rect x="638" y="272" width="97" height="24" rx="6" fill="#0f172a"/>
  <text x="686" y="288" text-anchor="middle" fill="#6366f1" font-family="Arial" font-size="10">Laravel REST API</text>
  <rect x="545" y="304" width="60" height="24" rx="6" fill="#0f172a"/>
  <text x="575" y="320" text-anchor="middle" fill="#22c55e" font-family="Arial" font-size="10">MySQL</text>
  <rect x="613" y="304" width="55" height="24" rx="6" fill="#0f172a"/>
  <text x="640" y="320" text-anchor="middle" fill="#ef4444" font-family="Arial" font-size="10">Firebase</text>
  <rect x="676" y="304" width="59" height="24" rx="6" fill="#0f172a"/>
  <text x="705" y="320" text-anchor="middle" fill="#0ea5e9" font-family="Arial" font-size="10">Google Maps</text>

  <rect x="545" y="345" width="190" height="36" rx="8" fill="url(#accent)"/>
  <text x="640" y="368" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">Chcę taką aplikację →</text>
</svg>
