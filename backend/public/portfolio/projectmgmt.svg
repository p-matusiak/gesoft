<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff"/>
      <stop offset="100%" style="stop-color:#f3e8ff"/>
    </linearGradient>
    <linearGradient id="accent5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg5)"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="white"/>
  <rect x="0" y="59" width="800" height="1" fill="#e9d5ff"/>

  <!-- Logo -->
  <rect x="25" y="15" width="30" height="30" rx="8" fill="url(#accent5)"/>
  <text x="65" y="37" fill="#581c87" font-family="Arial" font-size="18" font-weight="bold">TaskFlow</text>

  <!-- Navigation tabs -->
  <rect x="200" y="18" width="80" height="28" rx="6" fill="url(#accent5)"/>
  <text x="240" y="37" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">Board</text>
  <text x="320" y="37" fill="#6b7280" font-family="Arial" font-size="12">Lista</text>
  <text x="380" y="37" fill="#6b7280" font-family="Arial" font-size="12">Timeline</text>
  <text x="450" y="37" fill="#6b7280" font-family="Arial" font-size="12">Raporty</text>

  <!-- User avatars -->
  <circle cx="700" cy="30" r="15" fill="#c4b5fd"/>
  <circle cx="725" cy="30" r="15" fill="#a78bfa"/>
  <circle cx="750" cy="30" r="15" fill="#8b5cf6"/>
  <text x="750" y="35" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="bold">+5</text>

  <!-- Kanban Board -->
  <!-- Column 1: To Do -->
  <rect x="25" y="80" width="235" height="350" rx="12" fill="white"/>
  <text x="45" y="110" fill="#1f2937" font-family="Arial" font-size="14" font-weight="bold">Do zrobienia</text>
  <rect x="175" y="95" width="25" height="20" rx="10" fill="#fef3c7"/>
  <text x="187" y="109" text-anchor="middle" fill="#d97706" font-family="Arial" font-size="11" font-weight="bold">4</text>

  <!-- Task cards - To Do -->
  <rect x="35" y="130" width="215" height="80" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
  <rect x="45" y="140" width="50" height="18" rx="4" fill="#fef3c7"/>
  <text x="70" y="153" text-anchor="middle" fill="#d97706" font-family="Arial" font-size="9" font-weight="bold">DESIGN</text>
  <text x="45" y="175" fill="#1f2937" font-family="Arial" font-size="12" font-weight="bold">Nowy dashboard UI</text>
  <text x="45" y="195" fill="#6b7280" font-family="Arial" font-size="10">Redesign glownego panelu</text>

  <rect x="35" y="220" width="215" height="70" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
  <rect x="45" y="230" width="35" height="18" rx="4" fill="#dbeafe"/>
  <text x="62" y="243" text-anchor="middle" fill="#2563eb" font-family="Arial" font-size="9" font-weight="bold">DEV</text>
  <text x="45" y="265" fill="#1f2937" font-family="Arial" font-size="12" font-weight="bold">API integracja</text>
  <text x="45" y="280" fill="#6b7280" font-family="Arial" font-size="10">Stripe payments</text>

  <!-- Column 2: In Progress -->
  <rect x="280" y="80" width="235" height="350" rx="12" fill="white"/>
  <text x="300" y="110" fill="#1f2937" font-family="Arial" font-size="14" font-weight="bold">W trakcie</text>
  <rect x="420" y="95" width="25" height="20" rx="10" fill="#dbeafe"/>
  <text x="432" y="109" text-anchor="middle" fill="#2563eb" font-family="Arial" font-size="11" font-weight="bold">3</text>

  <!-- Task cards - In Progress -->
  <rect x="290" y="130" width="215" height="90" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="300" y="140" width="35" height="18" rx="4" fill="#dcfce7"/>
  <text x="317" y="153" text-anchor="middle" fill="#16a34a" font-family="Arial" font-size="9" font-weight="bold">DEV</text>
  <text x="300" y="175" fill="#1f2937" font-family="Arial" font-size="12" font-weight="bold">User authentication</text>
  <text x="300" y="195" fill="#6b7280" font-family="Arial" font-size="10">OAuth + 2FA implementation</text>
  <rect x="300" y="205" width="150" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="300" y="205" width="100" height="6" rx="3" fill="url(#accent5)"/>

  <rect x="290" y="230" width="215" height="80" rx="8" fill="white" stroke="#e9d5ff"/>
  <rect x="300" y="240" width="50" height="18" rx="4" fill="#fef3c7"/>
  <text x="325" y="253" text-anchor="middle" fill="#d97706" font-family="Arial" font-size="9" font-weight="bold">DESIGN</text>
  <text x="300" y="275" fill="#1f2937" font-family="Arial" font-size="12" font-weight="bold">Mobile responsive</text>
  <text x="300" y="295" fill="#6b7280" font-family="Arial" font-size="10">Dostosowanie do telefonow</text>

  <!-- Column 3: Done -->
  <rect x="535" y="80" width="235" height="350" rx="12" fill="white"/>
  <text x="555" y="110" fill="#1f2937" font-family="Arial" font-size="14" font-weight="bold">Zrobione</text>
  <rect x="685" y="95" width="25" height="20" rx="10" fill="#dcfce7"/>
  <text x="697" y="109" text-anchor="middle" fill="#16a34a" font-family="Arial" font-size="11" font-weight="bold">8</text>

  <!-- Task cards - Done -->
  <rect x="545" y="130" width="215" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="555" y="140" width="35" height="18" rx="4" fill="#dcfce7"/>
  <text x="572" y="153" text-anchor="middle" fill="#16a34a" font-family="Arial" font-size="9" font-weight="bold">DEV</text>
  <text x="555" y="172" fill="#9ca3af" font-family="Arial" font-size="12" text-decoration="line-through">Database schema</text>
  <text x="555" y="188" fill="#9ca3af" font-family="Arial" font-size="10">PostgreSQL setup</text>

  <rect x="545" y="210" width="215" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="555" y="220" width="45" height="18" rx="4" fill="#e0e7ff"/>
  <text x="577" y="233" text-anchor="middle" fill="#4f46e5" font-family="Arial" font-size="9" font-weight="bold">TEST</text>
  <text x="555" y="255" fill="#9ca3af" font-family="Arial" font-size="12" text-decoration="line-through">Unit tests</text>
  <text x="555" y="270" fill="#9ca3af" font-family="Arial" font-size="10">Coverage 94%</text>

  <rect x="545" y="290" width="215" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="555" y="300" width="50" height="18" rx="4" fill="#fef3c7"/>
  <text x="580" y="313" text-anchor="middle" fill="#d97706" font-family="Arial" font-size="9" font-weight="bold">DESIGN</text>
  <text x="555" y="335" fill="#9ca3af" font-family="Arial" font-size="12" text-decoration="line-through">Logo design</text>
  <text x="555" y="350" fill="#9ca3af" font-family="Arial" font-size="10">3 wersje kolorystyczne</text>
</svg>