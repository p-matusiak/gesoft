<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <text x="400" y="38" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="13">Aplikacja mobilna Android</text>

  <!-- Phone 1 - Job details -->
  <rect x="90" y="55" width="180" height="340" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="100" y="75" width="160" height="300" rx="8" fill="#0f172a"/>
  <rect x="155" y="58" width="70" height="12" rx="6" fill="#334155"/>

  <text x="180" y="97" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">Zlecenie #892</text>
  <rect x="140" y="105" width="80" height="20" rx="10" fill="#0ea5e9" opacity="0.2"/>
  <text x="180" y="119" text-anchor="middle" fill="#0ea5e9" font-family="Arial" font-size="10">Serwis klimatyzacji</text>

  <text x="110" y="145" fill="#64748b" font-family="Arial" font-size="10">Klient</text>
  <text x="110" y="160" fill="white" font-family="Arial" font-size="11">ABC Sp. z o.o.</text>
  <text x="110" y="180" fill="#64748b" font-family="Arial" font-size="10">Adres</text>
  <text x="110" y="195" fill="white" font-family="Arial" font-size="11">ul. Marszalkowska 12</text>
  <text x="110" y="210" fill="#64748b" font-family="Arial" font-size="10">Termin</text>
  <text x="110" y="225" fill="#0ea5e9" font-family="Arial" font-size="11">Dzis 14:00-16:00</text>

  <rect x="105" y="235" width="150" height="1" fill="#334155"/>

  <text x="110" y="255" fill="#64748b" font-family="Arial" font-size="10">Checklist:</text>
  <rect x="110" y="263" width="12" height="12" rx="3" fill="#22c55e"/>
  <text x="128" y="274" fill="white" font-family="Arial" font-size="10">Przeglad filtrów</text>
  <rect x="110" y="282" width="12" height="12" rx="3" fill="#22c55e"/>
  <text x="128" y="293" fill="white" font-family="Arial" font-size="10">Sprawdzenie czynnika</text>
  <rect x="110" y="301" width="12" height="12" rx="3" fill="#334155"/>
  <text x="128" y="312" fill="#64748b" font-family="Arial" font-size="10">Test wydajnosci</text>
  <rect x="110" y="320" width="12" height="12" rx="3" fill="#334155"/>
  <text x="128" y="331" fill="#64748b" font-family="Arial" font-size="10">Protokol odbioru</text>

  <rect x="108" y="345" width="144" height="26" rx="6" fill="url(#accent)"/>
  <text x="180" y="362" text-anchor="middle" fill="white" font-family="Arial" font-size="11">Zakoncz zlecenie</text>

  <!-- Phone 2 - Schedule -->
  <rect x="310" y="55" width="180" height="340" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="320" y="75" width="160" height="300" rx="8" fill="#0f172a"/>
  <rect x="375" y="58" width="70" height="12" rx="6" fill="#334155"/>

  <text x="400" y="97" text-anchor="middle" fill="white" font-family="Arial" font-size="13" font-weight="bold">Harmonogram</text>
  <text x="400" y="112" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Czwartek, 22 maja</text>

  <!-- Time slots -->
  <text x="328" y="135" fill="#64748b" font-family="Arial" font-size="10">08:00</text>
  <rect x="350" y="124" width="120" height="28" rx="6" fill="#1e293b"/>
  <text x="355" y="142" fill="#64748b" font-family="Arial" font-size="10">Wolne</text>

  <text x="328" y="172" fill="#64748b" font-family="Arial" font-size="10">10:00</text>
  <rect x="350" y="161" width="120" height="28" rx="6" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1"/>
  <text x="355" y="178" fill="#0ea5e9" font-family="Arial" font-size="10">XYZ Corp - instalacja</text>

  <text x="328" y="212" fill="#64748b" font-family="Arial" font-size="10">12:00</text>
  <rect x="350" y="201" width="120" height="28" rx="6" fill="#1e293b"/>
  <text x="355" y="218" fill="#64748b" font-family="Arial" font-size="10">Przerwa</text>

  <text x="328" y="249" fill="#64748b" font-family="Arial" font-size="10">14:00</text>
  <rect x="350" y="238" width="120" height="28" rx="6" fill="#1e3a5f" stroke="#f97316" stroke-width="1"/>
  <text x="355" y="255" fill="#f97316" font-family="Arial" font-size="10">ABC Sp. - serwis klim.</text>

  <text x="328" y="286" fill="#64748b" font-family="Arial" font-size="10">16:00</text>
  <rect x="350" y="275" width="120" height="28" rx="6" fill="#1e3a5f" stroke="#6366f1" stroke-width="1"/>
  <text x="355" y="292" fill="#a5b4fc" font-family="Arial" font-size="10">Kowalski - przeglad</text>

  <text x="328" y="323" fill="#64748b" font-family="Arial" font-size="10">18:00</text>
  <rect x="350" y="312" width="120" height="28" rx="6" fill="#1e293b"/>
  <text x="355" y="329" fill="#64748b" font-family="Arial" font-size="10">Wolne</text>

  <!-- Info panel -->
  <rect x="530" y="55" width="220" height="340" rx="12" fill="#1e293b"/>
  <text x="640" y="88" text-anchor="middle" fill="white" font-family="Arial" font-size="15" font-weight="bold">App serwisantów</text>
  <text x="640" y="108" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="11">Android (Kotlin)</text>

  <rect x="545" y="120" width="190" height="1" fill="#334155"/>

  <text x="545" y="145" fill="#94a3b8" font-family="Arial" font-size="11">● Harmonogram zleceń na dany dzień</text>
  <text x="545" y="165" fill="#94a3b8" font-family="Arial" font-size="11">● Checklista i protokoły odbioru</text>
  <text x="545" y="185" fill="#94a3b8" font-family="Arial" font-size="11">● Zdjęcia z realizacji</text>
  <text x="545" y="205" fill="#94a3b8" font-family="Arial" font-size="11">● Podpis klienta na ekranie</text>
  <text x="545" y="225" fill="#94a3b8" font-family="Arial" font-size="11">● Raport i historia serwisów</text>

  <rect x="545" y="240" width="190" height="1" fill="#334155"/>

  <text x="640" y="263" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Stack technologiczny</text>
  <rect x="545" y="272" width="85" height="24" rx="6" fill="#0f172a"/>
  <text x="587" y="288" text-anchor="middle" fill="#0ea5e9" font-family="Arial" font-size="10">Android Kotlin</text>
  <rect x="638" y="272" width="97" height="24" rx="6" fill="#0f172a"/>
  <text x="686" y="288" text-anchor="middle" fill="#6366f1" font-family="Arial" font-size="10">Laravel REST API</text>
  <rect x="545" y="304" width="60" height="24" rx="6" fill="#0f172a"/>
  <text x="575" y="320" text-anchor="middle" fill="#22c55e" font-family="Arial" font-size="10">MySQL</text>
  <rect x="613" y="304" width="122" height="24" rx="6" fill="#0f172a"/>
  <text x="674" y="320" text-anchor="middle" fill="#ef4444" font-family="Arial" font-size="10">Firebase (powiadomienia)</text>

  <rect x="545" y="345" width="190" height="36" rx="8" fill="url(#accent)"/>
  <text x="640" y="368" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">Chcę taką aplikację →</text>
</svg>
