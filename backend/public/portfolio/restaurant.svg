  <text x="305" y="165" text-anchor="middle" fill="white" font-family="Arial" font-size="10">Pizze (12)</text>
  <rect x="348" y="150" width="70" height="22" rx="11" fill="#1e293b"/>
  <text x="383" y="165" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Makarony (8)</text>
  <rect x="426" y="150" width="60" height="22" rx="11" fill="#1e293b"/>
  <text x="456" y="165" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Sałatki (6)</text>
  <rect x="494" y="150" width="55" height="22" rx="11" fill="#1e293b"/>
  <text x="521" y="165" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="10">Desery (5)</text>

