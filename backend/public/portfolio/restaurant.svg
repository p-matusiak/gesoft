  <text x="305" y="224" fill="#64748b" font-family="Arial" font-size="10">32 cm · klasyczna</text>
  <text x="305" y="246" fill="#f97316" font-family="Arial" font-size="13" font-weight="bold">28,00 zl</text>
  <text x="350" y="270" fill="#22c55e" font-family="Arial" font-size="10">● Dostepna</text>

  <rect x="395" y="183" width="175" height="100" rx="10" fill="#1e293b"/>
  <rect x="400" y="188" width="80" height="50" rx="6" fill="#374151"/>
  <text x="440" y="220" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="18">🍕</text>
  <text x="490" y="208" fill="white" font-family="Arial" font-size="11" font-weight="bold">Quattro Formaggi</text>
  <text x="490" y="224" fill="#64748b" font-family="Arial" font-size="10">32 cm · premium</text>
  <text x="490" y="246" fill="#f97316" font-family="Arial" font-size="13" font-weight="bold">38,00 zl</text>

  <rect x="580" y="183" width="195" height="100" rx="10" fill="#1e293b"/>
  <rect x="585" y="188" width="80" height="50" rx="6" fill="#374151"/>
  <text x="625" y="220" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="18">🍕</text>
  <text x="675" y="208" fill="white" font-family="Arial" font-size="11" font-weight="bold">Pepperoni</text>
  <text x="675" y="224" fill="#64748b" font-family="Arial" font-size="10">32 cm · pikantna</text>
  <text x="675" y="246" fill="#f97316" font-family="Arial" font-size="13" font-weight="bold">34,00 zl</text>

  <!-- Orders queue -->
  <rect x="210" y="295" width="565" height="140" rx="10" fill="#1e293b"/>
  <text x="225" y="318" fill="white" font-family="Arial" font-size="13" font-weight="bold">Kolejka zamówień - na żywo</text>

  <rect x="220" y="328" width="160" height="45" rx="8" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1"/>
  <text x="300" y="346" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">#087 · Dostawa</text>
  <text x="300" y="362" text-anchor="middle" fill="#0ea5e9" font-family="Arial" font-size="10">8 min → kuchnia</text>

  <rect x="390" y="328" width="160" height="45" rx="8" fill="#1e3b2f" stroke="#22c55e" stroke-width="1"/>
  <text x="470" y="346" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">#086 · Na miejscu</text>
  <text x="470" y="362" text-anchor="middle" fill="#22c55e" font-family="Arial" font-size="10">Gotowe · stolik 4</text>

  <rect x="560" y="328" width="160" height="45" rx="8" fill="#2d1b0e" stroke="#f97316" stroke-width="1"/>
  <text x="640" y="346" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">#085 · Odbiór osobisty</text>
  <text x="640" y="362" text-anchor="middle" fill="#f97316" font-family="Arial" font-size="10">15 min → w realizacji</text>

  <text x="225" y="410" fill="#64748b" font-family="Arial" font-size="10">Stack: Laravel + Vue.js + MySQL + WebSockets (realtime) + integracja z drukarką paragonową</text>
</svg>
