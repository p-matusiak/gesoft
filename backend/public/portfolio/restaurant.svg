<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="190" height="450" fill="#0f172a"/>
  <rect x="189" y="0" width="1" height="450" fill="#334155"/>
  <text x="95" y="46" text-anchor="middle" fill="#f97316" font-family="Arial" font-size="16" font-weight="bold">🍕 RestaurantOS</text>
  <rect x="15" y="68" width="160" height="32" rx="6" fill="url(#accent)"/>
  <text x="95" y="89" text-anchor="middle" fill="white" font-family="Arial" font-size="12">Menu online</text>
  <text x="25" y="130" fill="#64748b" font-family="Arial" font-size="12">Zamówienia</text>
  <text x="25" y="160" fill="#64748b" font-family="Arial" font-size="12">Kasa/POS</text>
  <text x="25" y="190" fill="#64748b" font-family="Arial" font-size="12">Rezerwacje</text>
  <text x="25" y="220" fill="#64748b" font-family="Arial" font-size="12">Kuchnia (KDS)</text>
  <text x="25" y="250" fill="#64748b" font-family="Arial" font-size="12">Raporty</text>
  <text x="25" y="280" fill="#64748b" font-family="Arial" font-size="12">Pracownicy</text>

