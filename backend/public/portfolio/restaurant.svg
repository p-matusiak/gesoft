  <text x="375" y="118" fill="#22c55e" font-family="Arial" font-size="24" font-weight="bold">3 840 zl</text>

  <rect x="510" y="70" width="140" height="65" rx="10" fill="#1e293b"/>
  <text x="525" y="93" fill="#64748b" font-family="Arial" font-size="10">Sr. czas realizacji</text>
  <text x="525" y="118" fill="white" font-family="Arial" font-size="24" font-weight="bold">18 min</text>

  <rect x="660" y="70" width="115" height="65" rx="10" fill="#1e293b"/>
