<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdfa"/>
      <stop offset="100%" style="stop-color:#ecfeff"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg3)"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="65" fill="white"/>
  <rect x="0" y="64" width="800" height="1" fill="#99f6e4"/>

  <!-- Logo -->
  <circle cx="55" cy="32" r="18" fill="url(#accent3)"/>
  <text x="55" y="38" text-anchor="middle" fill="white" font-family="Arial" font-size="18" font-weight="bold">+</text>
  <text x="85" y="38" fill="#0d9488" font-family="Arial" font-size="18" font-weight="bold">MedPortal</text>

  <!-- Navigation -->
  <text x="280" y="38" fill="#0d9488" font-family="Arial" font-size="13" font-weight="bold">Umow wizyte</text>
  <text x="390" y="38" fill="#57534e" font-family="Arial" font-size="13">Lekarze</text>
  <text x="460" y="38" fill="#57534e" font-family="Arial" font-size="13">Uslugi</text>
  <text x="520" y="38" fill="#57534e" font-family="Arial" font-size="13">Kontakt</text>

  <!-- User menu -->
  <rect x="650" y="15" width="120" height="35" rx="17" fill="url(#accent3)"/>
  <text x="710" y="38" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">Moje konto</text>

  <!-- Main content -->
  <rect x="30" y="85" width="460" height="340" rx="16" fill="white"/>

  <!-- Booking form header -->
  <text x="55" y="125" fill="#0f172a" font-family="Arial" font-size="20" font-weight="bold">Umow wizyte online</text>
  <text x="55" y="148" fill="#64748b" font-family="Arial" font-size="12">Wybierz specjalizacje, lekarza i termin</text>

  <!-- Form steps -->
  <circle cx="70" cy="185" r="14" fill="url(#accent3)"/>
  <text x="70" y="190" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">1</text>
  <line x1="84" y1="185" x2="150" y2="185" stroke="#99f6e4" stroke-width="2"/>
  <circle cx="165" cy="185" r="14" fill="url(#accent3)"/>
  <text x="165" y="190" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">2</text>
  <line x1="179" y1="185" x2="245" y2="185" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="260" cy="185" r="14" fill="#e2e8f0"/>
  <text x="260" y="190" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="11" font-weight="bold">3</text>

  <!-- Specialization dropdown -->
  <text x="55" y="230" fill="#334155" font-family="Arial" font-size="12" font-weight="bold">Specjalizacja</text>
  <rect x="55" y="240" width="200" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="265" fill="#0f172a" font-family="Arial" font-size="13">Kardiolog</text>

  <!-- Doctor selection -->
  <text x="270" y="230" fill="#334155" font-family="Arial" font-size="12" font-weight="bold">Lekarz</text>
  <rect x="270" y="240" width="200" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="285" y="265" fill="#0f172a" font-family="Arial" font-size="13">dr n. med. Jan Kowalski</text>

  <!-- Calendar -->
  <text x="55" y="310" fill="#334155" font-family="Arial" font-size="12" font-weight="bold">Dostepne terminy - Styczen 2024</text>

  <!-- Calendar grid -->
  <rect x="55" y="325" width="40" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="75" y="347" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="11">22</text>

  <rect x="105" y="325" width="40" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="125" y="347" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="11">23</text>

  <rect x="155" y="325" width="40" height="35" rx="6" fill="url(#accent3)"/>
  <text x="175" y="347" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">24</text>

  <rect x="205" y="325" width="40" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="225" y="347" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="11">25</text>

  <rect x="255" y="325" width="40" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="275" y="347" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="11">26</text>

  <!-- Time slots -->
  <text x="320" y="310" fill="#334155" font-family="Arial" font-size="12" font-weight="bold">Godzina</text>
  <rect x="320" y="325" width="70" height="30" rx="6" fill="url(#accent3)"/>
  <text x="355" y="345" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">10:00</text>

  <rect x="400" y="325" width="70" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="435" y="345" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="11">11:30</text>

  <!-- Submit button -->
  <rect x="55" y="380" width="420" height="45" rx="10" fill="url(#accent3)"/>
  <text x="265" y="408" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">Zarezerwuj wizyte</text>

  <!-- Sidebar - Doctor info -->
  <rect x="510" y="85" width="260" height="200" rx="16" fill="white"/>
  <circle cx="640" cy="140" r="35" fill="#ccfbf1"/>
  <text x="640" y="148" text-anchor="middle" fill="#0d9488" font-family="Arial" font-size="28">JK</text>
  <text x="640" y="195" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="14" font-weight="bold">dr n. med. Jan Kowalski</text>
  <text x="640" y="215" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="12">Kardiolog</text>

  <!-- Rating -->
  <text x="600" y="250" fill="#fbbf24" font-family="Arial" font-size="14">★★★★★</text>
  <text x="680" y="250" fill="#64748b" font-family="Arial" font-size="12">4.9 (127 opinii)</text>

  <!-- Stats sidebar -->
  <rect x="510" y="300" width="260" height="125" rx="16" fill="white"/>
  <text x="535" y="335" fill="#0f172a" font-family="Arial" font-size="14" font-weight="bold">Dzisiejsze statystyki</text>

  <text x="535" y="365" fill="#64748b" font-family="Arial" font-size="11">Umowione wizyty</text>
  <text x="720" y="365" fill="#0d9488" font-family="Arial" font-size="14" font-weight="bold">24</text>

  <text x="535" y="390" fill="#64748b" font-family="Arial" font-size="11">Wolne terminy</text>
  <text x="720" y="390" fill="#0d9488" font-family="Arial" font-size="14" font-weight="bold">8</text>

  <text x="535" y="415" fill="#64748b" font-family="Arial" font-size="11">Aktywni pacjenci</text>
  <text x="720" y="415" fill="#0d9488" font-family="Arial" font-size="14" font-weight="bold">1,247</text>
</svg>