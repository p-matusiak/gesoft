<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" role="img" aria-label="GESOFT logo">
  <defs>
    <!-- Gradient matching the source logo: bright red top-left → deep crimson bottom-right -->
    <linearGradient id="gGrad" x1="5" y1="5" x2="75" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8001d"/>
      <stop offset="100%" stop-color="#7a000c"/>
    </linearGradient>
  </defs>

  <!--
    G icon: annular arc, center (40,40), outer r=35, inner r=21.
    Opening ~65° at upper-right (295°–0°).
    Crossbar closes Z from inner-right (61,40) to outer-right (75,40).
  -->
  <path
    d="M 75,40 A 35,35 0 1,1 55,8 L 49,21 A 21,21 0 1,0 61,40 Z"
    fill="url(#gGrad)"
  />

  <!-- Full wordmark: gesoft.pl -->
  <text
    x="92" y="57"
    font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="52" font-weight="900" letter-spacing="-1"
  ><tspan fill="#111111">gesoft</tspan><tspan fill="#d7241b">.pl</tspan></text>
</svg>
