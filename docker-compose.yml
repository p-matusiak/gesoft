services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: gesoft-app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./frontend:/var/www/frontend
    networks:
      - gesoft-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: gesoft-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gesoft-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: gesoft-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gesoft
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: gesoft
      MYSQL_PASSWORD: secret
    ports:
      - "33065:3306"
    volumes:
      - gesoft-db-data:/var/lib/mysql
    networks:
      - gesoft-network

  node:
    image: node:20-alpine
    container_name: gesoft-node
    working_dir: /var/www/frontend
    volumes:
      - ./frontend:/var/www/frontend
      - ./backend/public:/var/www/backend/public
    command: sh -c "npm install && npm run build"
    networks:
      - gesoft-network

networks:
  gesoft-network:
    driver: bridge

volumes:
  gesoft-db-data:
