services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: gesoft-app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./frontend:/var/www/frontend
    networks:
      - gesoft-network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: gesoft-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gesoft-network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: gesoft-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gesoft
      POSTGRES_USER: gesoft
      POSTGRES_PASSWORD: secret
    ports:
      - "54365:5432"
    volumes:
      - gesoft-pg-data:/var/lib/postgresql/data
    networks:
      - gesoft-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gesoft -d gesoft"]
      interval: 5s
      timeout: 5s
      retries: 10

  node:
    image: node:20-alpine
    container_name: gesoft-node
    working_dir: /var/www/frontend
    volumes:
      - ./frontend:/var/www/frontend
      - ./backend/public:/var/www/backend/public
    command: sh -c "npm install && npm run build"
    networks:
      - gesoft-network

networks:
  gesoft-network:
    driver: bridge

volumes:
  gesoft-pg-data:
